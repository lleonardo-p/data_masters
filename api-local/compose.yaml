services:
  db:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dengue_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_KEY: ${API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  importer:
    build: .
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.import_csv"]

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "api:8000", "--log", "stdout"]
    ports:
      - "4040:4040"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dengue_postgres_data:

