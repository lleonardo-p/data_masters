services:
  db:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dengue_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_KEY: ${API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  importer:
    build: .
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.import_csv"]

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "api:8000", "--log", "stdout"]
    ports:
      - "4040:4040"
    depends_on:
      - api
    restart: unless-stopped

  hospital-simulator:
    build: ./hospital_simulator
    profiles: ["nrt"]
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-baip-dev}
      SQS_QUEUE_URL: ${NRT_SQS_QUEUE_URL:-}
      EVENT_INTERVAL_SECONDS: ${NRT_EVENT_INTERVAL_SECONDS:-3}
      MAX_EVENTS: ${NRT_MAX_EVENTS:-0}
      DRY_RUN: ${NRT_DRY_RUN:-false}
      RANDOM_SEED: ${NRT_RANDOM_SEED:-}
      LOG_LEVEL: ${NRT_LOG_LEVEL:-INFO}
    volumes:
      - ${HOME}/.aws:/home/appuser/.aws:ro
    restart: on-failure

volumes:
  dengue_postgres_data:
